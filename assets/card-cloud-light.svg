<svg xmlns="http://www.w3.org/2000/svg" width="436" height="152" viewBox="0 0 436 152" fill="none" role="img" aria-label="Engenharia &amp; Nuvem AWS">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="436" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="cc"><rect x="1" y="1" width="434" height="150" rx="14"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    @keyframes pd { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.85)} }
    @keyframes pr { 0%{r:4;opacity:.75} 100%{r:10;opacity:0} }
    .d { animation: pd 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .r { animation: pr 2.2s ease-out infinite; }
  </style>
  <g clip-path="url(#cc)">
    <rect x="1" y="1" width="434" height="150" rx="14" fill="url(#cbg)"/>
    <rect x="1" y="1" width="434" height="3.5" fill="#4F7263"/>
  </g>
  <rect x="1" y="1" width="434" height="150" rx="14" stroke="#DFD7C8" stroke-width="1.2"/>
  <circle cx="26" cy="28" r="4" fill="#4F7263" class="r"/>
  <circle cx="26" cy="28" r="4" fill="#4F7263" class="d"/>
  <text x="38" y="32" class="mono" font-size="10.5" font-weight="700" fill="#2A6865">ARQUITETURA 2.0</text>
  <text x="414" y="32" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#5C6B82">EXPLORAR ↓</text>

  <text x="22" y="63" class="sans" font-size="18.5" font-weight="800" fill="#1F2A44">Engenharia &amp; Nuvem AWS</text>
  <text x="22" y="86" class="sans" font-size="12.5" fill="#5C6B82">Ecossistema modular e orientado a eventos na AWS para</text>
  <text x="22" y="104" class="sans" font-size="12.5" fill="#5C6B82">processar clima, relevo e alertas sob picos de temporal.</text>

  <g transform="translate(22, 118)">
    <rect x="0" y="0" width="144" height="22" rx="6" fill="rgba(58, 140, 138, 0.11)"/>
    <text x="72" y="14.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#2A6865">AWS · ESCALÁVEL</text>
    <rect x="152" y="0" width="144" height="22" rx="6" fill="#FFFFFF" stroke="#DDD5C6" stroke-width="1"/>
    <text x="224" y="14.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#33415C">IA EXPLICÁVEL</text>
  </g>
</svg>