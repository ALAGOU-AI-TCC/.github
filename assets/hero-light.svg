<svg xmlns="http://www.w3.org/2000/svg" width="900" height="295" viewBox="0 0 900 295" fill="none" role="img" aria-label="AlagouAI? 2.0 - Inteligência Climática Urbana em São Paulo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A6865"/>
      <stop offset="50%" stop-color="#3A8C8A"/>
      <stop offset="100%" stop-color="#F1DCC3"/>
    </linearGradient>
    <linearGradient id="hl" x1="36" y1="125" x2="470" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A6865"/>
      <stop offset="55%" stop-color="#3A8C8A"/>
      <stop offset="100%" stop-color="#4F7263"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.14" cy="0.18" r="0.48">
      <stop offset="0%" stop-color="#3A8C8A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3A8C8A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.88" cy="0.82" r="0.48">
      <stop offset="0%" stop-color="#F1DCC3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F1DCC3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DDD5C6" opacity="0.7"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="898" height="293" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.85)} }
    @keyframes pulseRing { 0%{r:4;opacity:.8} 100%{r:11;opacity:0} }
    @keyframes radarWave { 0%{r:14;opacity:.65} 100%{r:76;opacity:0} }
    @keyframes hexGlow1 { 0%,100%{opacity:.28} 50%{opacity:.85} }
    @keyframes hexGlow2 { 0%,100%{opacity:.78} 50%{opacity:.25} }
    @keyframes hexGlow3 { 0%,100%{opacity:.35} 50%{opacity:.75} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes barPulse { 0%,100%{opacity:.65} 50%{opacity:1} }
    .dot { animation: pulseDot 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring { animation: pulseRing 2.2s ease-out infinite; }
    .wave1 { animation: radarWave 3.6s ease-out infinite; }
    .wave2 { animation: radarWave 3.6s ease-out 1.8s infinite; }
    .h1 { animation: hexGlow1 3.8s ease-in-out infinite; }
    .h2 { animation: hexGlow2 4.4s ease-in-out infinite; }
    .h3 { animation: hexGlow3 3.2s ease-in-out infinite; }
    .cur { animation: blink 1.1s infinite; }
    .bp { animation: barPulse 2.8s ease-in-out infinite; }
  </style>

  <g clip-path="url(#clip)">
    <rect x="1" y="1" width="898" height="293" rx="18" fill="url(#bg)"/>
    <rect x="1" y="1" width="898" height="293" fill="url(#dots)"/>
    <rect x="1" y="1" width="898" height="293" fill="url(#g1)"/>
    <rect x="1" y="1" width="898" height="293" fill="url(#g2)"/>
    <rect x="1" y="1" width="898" height="4" fill="url(#topBar)"/>
  </g>
  <rect x="1" y="1" width="898" height="293" rx="18" stroke="#DFD7C8" stroke-width="1.2"/>

  <!-- Left Content -->
  <rect x="36" y="28" width="322" height="26" rx="13" fill="rgba(58, 140, 138, 0.11)" stroke="rgba(42, 104, 101, 0.3)" stroke-width="1"/>
  <circle cx="52" cy="41" r="4" fill="#2A6865" class="ring"/>
  <circle cx="52" cy="41" r="4" fill="#2A6865" class="dot"/>
  <text x="65" y="45" class="mono" font-size="10.8" font-weight="600" fill="#2A6865">INTELIGÊNCIA CLIMÁTICA · SÃO PAULO</text>

  <!-- Brand Droplet Icon + Title -->
  <g transform="translate(36, 72)">
    <path d="M18 2C18 2 4 17.5 4 27.5C4 35.2 10.3 41.5 18 41.5C25.7 41.5 32 35.2 32 27.5C32 17.5 18 2 18 2Z" fill="#2A6865"/>
    <path d="M11 28.5L18 22.5L25 28.5M13.5 27V34.5H22.5V27" stroke="#FAF7F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 36.2C12.5 34.5 15.5 34.5 18 36.2C20.5 37.9 23.5 37.9 26 36.2" stroke="#3A8C8A" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="80" y="106" class="sans" font-size="37" font-weight="800" letter-spacing="-0.8" fill="#1F2A44">AlagouAI?</text>
  <rect x="272" y="81" width="52" height="24" rx="12" fill="rgba(58, 140, 138, 0.11)" stroke="rgba(42, 104, 101, 0.3)" stroke-width="1"/>
  <text x="298" y="97" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#2A6865">v2.0</text>

  <text x="36" y="142" class="sans" font-size="18" font-weight="700" fill="url(#hl)">Antecipe a chuva. Se proteja em São Paulo.</text>

  <text x="36" y="172" class="sans" font-size="13.5" fill="#5C6B82">Previsão espaço-temporal de alagamentos combinando clima oficial,</text>
  <text x="36" y="193" class="sans" font-size="13.5" fill="#5C6B82">relevo urbano, IA explicável e validação comunitária em nuvem AWS.</text>

  <!-- Brand Pills -->
  <g transform="translate(36, 222)">
    <rect x="0" y="0" width="144" height="32" rx="9" fill="#FFFFFF" stroke="#DDD5C6" stroke-width="1"/>
    <text x="72" y="20.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#1F2A44">⏱ +24h Antecipação</text>

    <rect x="154" y="0" width="166" height="32" rx="9" fill="#FFFFFF" stroke="#DDD5C6" stroke-width="1"/>
    <text x="237" y="20.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#1F2A44">🗺️ Malha Geoespacial</text>

    <rect x="330" y="0" width="128" height="32" rx="9" fill="#FFFFFF" stroke="#DDD5C6" stroke-width="1"/>
    <text x="394" y="20.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#1F2A44">☁️ Cloud AWS</text>
  </g>

  <!-- Right Live Spatial Radar Console -->
  <g transform="translate(534, 28)">
    <rect x="0" y="0" width="330" height="239" rx="14" fill="#FFFFFF" stroke="#DFD7C8" stroke-width="1.2"/>
    <!-- Console Header -->
    <rect x="0" y="0" width="330" height="34" rx="14" fill="#F7F3EC"/>
    <rect x="0" y="20" width="330" height="14" fill="#F7F3EC"/>
    <line x1="0" y1="34" x2="330" y2="34" stroke="#DFD7C8" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#3A8C8A" class="dot"/>
    <text x="28" y="21" class="mono" font-size="10.5" font-weight="600" fill="#33415C">SP_GEO_RADAR</text>
    <text x="314" y="21" text-anchor="end" class="mono" font-size="10" fill="#2A6865">LIVE<tspan class="cur">_</tspan></text>

    <!-- Animated Hex Cluster + Radar Ripples -->
    <g transform="translate(165, 114)">
      <circle cx="0" cy="0" r="64" stroke="rgba(42, 104, 101, 0.25)" stroke-width="1" stroke-dasharray="4 5"/>
      <circle cx="0" cy="0" r="38" stroke="rgba(42, 104, 101, 0.25)" stroke-width="1"/>
      <circle cx="0" cy="0" r="14" stroke="#3A8C8A" stroke-width="1.6" class="wave1"/>
      <circle cx="0" cy="0" r="14" stroke="#C79658" stroke-width="1.2" class="wave2"/>

      <!-- Hex cells (SP conceptual mesh) -->
      <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#3A8C8A" fill-opacity="0.48" stroke="#2A6865" stroke-width="1.3" class="h1"/>
      <polygon points="44,-24 65,-12 65,12 44,24 23,12 23,-12" fill="#D9822B" fill-opacity="0.42" stroke="#F1DCC3" stroke-width="1.1" class="h2"/>
      <polygon points="-44,-24 -23,-12 -23,12 -44,24 -65,12 -65,-12" fill="#3A8C8A" fill-opacity="0.34" stroke="#2A6865" stroke-width="1.1" class="h3"/>
      <polygon points="22,-60 43,-48 43,-24 22,-12 1,-24 1,-48" fill="#D94E3B" fill-opacity="0.48" stroke="#F59E8B" stroke-width="1.1" class="h2"/>
      <polygon points="-22,-60 -1,-48 -1,-24 -22,-12 -43,-24 -43,-48" fill="#4F7263" fill-opacity="0.42" stroke="#2A6865" stroke-width="1.1" class="h1"/>
      <polygon points="22,12 43,24 43,48 22,60 1,48 1,24" fill="#3A8C8A" fill-opacity="0.30" stroke="#2A6865" stroke-width="1" class="h3"/>
      <polygon points="-22,12 -1,24 -1,48 -22,60 -43,48 -43,24" fill="#4F7263" fill-opacity="0.32" stroke="#2A6865" stroke-width="1" class="h1"/>

      <!-- Center beacon -->
      <circle cx="0" cy="0" r="4.5" fill="#2A6865"/>
      <circle cx="22" cy="-36" r="3.5" fill="#F1DCC3" class="dot"/>
    </g>

    <!-- Bottom Telemetry Strip -->
    <line x1="16" y1="194" x2="314" y2="194" stroke="#DFD7C8" stroke-width="1"/>
    <g transform="translate(18, 206)">
      <rect x="0" y="0" width="66" height="20" rx="6" fill="rgba(58, 140, 138, 0.11)"/>
      <text x="33" y="13.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#2A6865">CLIMA</text>

      <rect x="74" y="0" width="68" height="20" rx="6" fill="rgba(58, 140, 138, 0.11)"/>
      <text x="108" y="13.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#2A6865">RELEVO</text>

      <rect x="150" y="0" width="62" height="20" rx="6" fill="rgba(58, 140, 138, 0.11)"/>
      <text x="181" y="13.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#2A6865">IA 2.0</text>

      <rect x="220" y="0" width="74" height="20" rx="6" fill="rgba(58, 140, 138, 0.11)" class="bp"/>
      <text x="257" y="13.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#2A6865">CONFIANÇA</text>
    </g>
  </g>
</svg>